name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Lockfile
        run: uv lock --check
      - name: Install
        run: uv sync --group dev
      - name: Ruff
        run: uv run ruff check .
      - name: Tests
        run: uv run pytest -q
      - name: Build
        run: uv build
